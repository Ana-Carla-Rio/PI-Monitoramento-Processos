
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Processos | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            max-width: 100%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #764ba2;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #5b3785;
        }

        .rodape {
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Bem-vindo!</h1>

        <p>Faça login para acessar o sistema.</p>

        <form id="loginForm">

            <input
                type="text"
                id="usuario"
                placeholder="Login"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">Entrar</button>

        </form>

        <div class="rodape">
            Sistema de Monitoramento de Processos
        </div>

    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                window.location.href = "/cadProcessos";

            });
    </script>

</body>
</html>
